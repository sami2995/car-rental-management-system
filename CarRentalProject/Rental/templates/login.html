{% extends "base.html" %}

{% block title %}Login - Car Rental System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🚗</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your Car Rental account</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Login</button>
        </form>
        
        <div style="text-align: center; margin-top: 24px; font-size: 14px;">
            <span style="color: var(--text-secondary);">Don't have an account?</span>
            <a href="{% url 'signup_url' %}" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
